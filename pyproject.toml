[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exoself"
version = "0.3.0"
description = "An unchosen, verifiable temperament for software agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "exoself contributors" }]
keywords = ["agents", "llm", "personality", "temperament", "deterministic", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://cyoren.github.io/exoself/"
Repository = "https://github.com/cYoren/exoself"
Specification = "https://github.com/cYoren/exoself/blob/main/SPEC.md"
Changelog = "https://github.com/cYoren/exoself/blob/main/AGENTS.md"

[project.scripts]
exoself = "exoself.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exoself = ["registry/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
