[workspace]
resolver = "2"
members = ["crates/exoself-core", "crates/exoself-cli", "crates/exoself-wasm"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cYoren/exoself"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
